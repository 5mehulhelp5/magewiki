schemaVersion: "2.0.0"
metadataTest:
  user: "appuser"
  exposedPorts: ["8000"]
  workdir: "/app"
  cmd: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
commandTests:
  - name: "python version"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3\\.13\\..*"]
  - name: "uvicorn installed"
    command: "uvicorn"
    args: ["--version"]
  - name: "runs as non-root"
    command: "whoami"
    expectedOutput: ["appuser"]
fileExistenceTests:
  - name: "app entrypoint"
    path: "/app/app/main.py"
    shouldExist: true
  - name: "pyproject.toml"
    path: "/app/pyproject.toml"
    shouldExist: true
