apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-analyzer
  template:
    metadata:
      labels:
        app: php-analyzer
    spec:
      containers:
        - name: php-analyzer
          image: magewiki-php-analyzer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Same reasoning as api.yaml's own resources block -- sized higher
          # than api/worker since this runs PHPStan/PHPMD/phpcs/Rector (and
          # run_phpunit()) against a scanned module's own real code, across
          # three co-installed PHP runtimes.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Previously missing entirely, unlike every other service here --
          # a hung PHP process (e.g. a stuck phpunit subprocess despite
          # tini reaping) left the pod marked Ready forever, with no
          # self-healing. `php -S` (index.php's CMD) is single-threaded and
          # blocks for the duration of whatever it's processing, so the
          # liveness probe's own failureThreshold*periodSeconds (150s) is
          # deliberately well past run_phpunit()'s own worst case
          # (PHPUNIT_TIMEOUT_SECONDS = 90s, plus a 5s SIGKILL grace period)
          # -- a probe timing this tight would restart a pod that's still
          # legitimately working, not actually hung.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: php-analyzer
spec:
  selector:
    app: php-analyzer
  ports:
    - port: 8080
      targetPort: 8080
---
# Mirrors docker-compose.yml's php_analyzer_net (internal: true) -- run_phpunit()
# (php-analyzer/public/index.php) is the one place this whole project executes a
# scanned module's own third-party code rather than only parsing it, and nothing
# this sidecar does at runtime ever needs the internet (composer install already
# happened at image build time). An empty egress list with no other rules means
# "no egress at all" under standard NetworkPolicy semantics -- responses to
# already-established inbound connections (the actual use case: api/worker calling
# this Service) are unaffected, only this pod *initiating* new outbound connections
# is blocked. Verified directly against a real kind cluster (kindnet now enforces
# NetworkPolicy, confirmed empirically rather than assumed) before trusting this,
# not just assumed from the Compose-level change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: php-analyzer-no-egress
spec:
  podSelector:
    matchLabels:
      app: php-analyzer
  policyTypes:
    - Egress
  egress: []
