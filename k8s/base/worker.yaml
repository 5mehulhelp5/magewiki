apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: magewiki-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.tasks.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: magewiki-config
            - secretRef:
                name: magewiki-secrets
          # Same reasoning as api.yaml's own resources block -- sized a bit
          # higher here since scanning/parsing a real module tree is more
          # memory-hungry than serving API requests.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
